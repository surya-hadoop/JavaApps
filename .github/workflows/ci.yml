name: Java CI with MySQL Integration

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # This mirrors your docker-compose.infra.yaml for the CI environment
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root_password
          MYSQL_DATABASE: contact_vault
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v3
      with:
        java-version: '11'
        distribution: 'temurin' # High-performance OpenJDK distribution
        cache: maven

    - name: Build and Run Test Pyramid
      run: mvn clean test
      env:
        # These match the service container above
        DB_HOST: localhost
        DB_PORT: 3306
        DB_NAME: contact_vault
        DB_USER: root
        DB_PASSWORD: root_password

    - name: Package Uber-JAR
      if: success()
      run: mvn package -DskipTests

    - name: Upload Build Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: ContactMigrator-Artifact
        path: target/*.jar